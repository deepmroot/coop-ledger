<body class="bg-slate-900 text-slate-200 font-sans antialiased">

<div class="max-w-4xl mx-auto px-6 py-14">
  <header class="border-b border-slate-800 pb-6 mb-8">
    <div class="font-mono text-xs uppercase tracking-widest text-sky-400 mb-2">Mandeep Singh &middot; Co-op Search</div>
    <h1 class="font-display text-4xl font-semibold text-slate-100 text-balance">The Co-op Ledger</h1>
    <p class="mt-2 text-sm text-slate-400 max-w-xl">Record of every Winter/Summer 2027 co-op application — status, tailored documents, and the original posting, in one place.</p>
  </header>

  <div class="grid grid-cols-4 gap-3 mb-8">
    <div class="rounded-lg border border-slate-800 bg-slate-800/40 p-4">
      <div class="font-mono text-2xl tabular-nums text-violet-300" id="stat-interview">–</div>
      <div class="text-xs text-slate-400 mt-1">Interview</div>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-800/40 p-4">
      <div class="font-mono text-2xl tabular-nums text-emerald-400" id="stat-applied">–</div>
      <div class="text-xs text-slate-400 mt-1">Applied</div>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-800/40 p-4">
      <div class="font-mono text-2xl tabular-nums text-amber-300" id="stat-prepared">–</div>
      <div class="text-xs text-slate-400 mt-1">Prepared, not yet applied</div>
    </div>
    <div class="rounded-lg border border-slate-800 bg-slate-800/40 p-4">
      <div class="font-mono text-2xl tabular-nums text-sky-400" id="stat-total">–</div>
      <div class="text-xs text-slate-400 mt-1">Total tracked</div>
    </div>
  </div>
  <div class="font-mono text-xs text-slate-500 mb-10" id="updated-line"></div>

  <section class="mb-10">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="font-display text-lg font-medium text-slate-100">Interview</h2>
      <span class="font-mono text-xs text-slate-500" id="interview-count"></span>
    </div>
    <div class="rounded-lg border border-slate-800 divide-y divide-slate-800 bg-slate-800/20 overflow-hidden" id="interview-list"></div>
  </section>

  <section class="mb-10">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="font-display text-lg font-medium text-slate-100">Applied</h2>
      <span class="font-mono text-xs text-slate-500" id="applied-count"></span>
    </div>
    <div class="rounded-lg border border-slate-800 divide-y divide-slate-800 bg-slate-800/20 overflow-hidden" id="applied-list"></div>
  </section>

  <section class="mb-10">
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="font-display text-lg font-medium text-slate-100">Prepared</h2>
      <span class="font-mono text-xs text-slate-500" id="prepared-count"></span>
    </div>
    <div class="rounded-lg border border-slate-800 divide-y divide-slate-800 bg-slate-800/20 overflow-hidden" id="prepared-list"></div>
  </section>

  <footer class="text-center font-mono text-xs text-slate-500 mt-6">source: <a class="text-slate-500 hover:text-slate-300 underline underline-offset-2" href="https://github.com/deepmroot/coop-ledger">deepmroot/coop-ledger</a></footer>
</div>

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function slugify(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  }

  function renderRow(d) {
    var settled = d.status === "applied" || d.status === "interview";
    var pillClasses =
      d.status === "interview"
        ? "bg-violet-400/10 text-violet-300 border-violet-400/20"
        : d.status === "applied"
        ? "bg-emerald-400/10 text-emerald-300 border-emerald-400/20"
        : "bg-amber-300/10 text-amber-200 border-amber-300/20";

    var links = "";
    if (d.resumeUrl) {
      links += '<a class="text-sm text-sky-400 hover:text-sky-300 hover:underline underline-offset-2" href="' + escapeHtml(d.resumeUrl) + '" target="_blank" rel="noopener">Resume</a>';
    } else {
      links += '<span class="text-xs text-slate-500 italic">no resume file</span>';
    }
    if (d.coverUrl) {
      links += '<a class="text-sm text-sky-400 hover:text-sky-300 hover:underline underline-offset-2" href="' + escapeHtml(d.coverUrl) + '" target="_blank" rel="noopener">Cover letter</a>';
    }
    if (d.applyLink) {
      links += '<a class="text-sm text-sky-400 hover:text-sky-300 hover:underline underline-offset-2" href="' + escapeHtml(d.applyLink) + '" target="_blank" rel="noopener">Posting ↗</a>';
    } else {
      links += '<span class="text-xs text-slate-500 italic">apply link needed</span>';
    }
    if (d.emailLink) {
      links += '<a class="text-sm text-sky-400 hover:text-sky-300 hover:underline underline-offset-2" href="' + escapeHtml(d.emailLink) + '" target="_blank" rel="noopener">Confirmation email ↗</a>';
    }
    if (d.interviewLink) {
      links += '<a class="text-sm font-medium text-violet-300 hover:text-violet-200 hover:underline underline-offset-2" href="' + escapeHtml(d.interviewLink) + '" target="_blank" rel="noopener">Book intro call ↗</a>';
    }

    var slug = slugify(d.company);
    var actionCell = '<div class="flex flex-col items-start gap-1.5">';
    if (settled) {
      if (d.copyMsg) {
        actionCell +=
          '<div class="text-xs text-emerald-300 max-w-[24ch]">Confirmed this session — not yet saved.</div>' +
          '<button class="copy-msg text-[11px] text-sky-400 underline underline-offset-2 bg-transparent border-0 p-0 cursor-pointer" data-msg="' + escapeHtml(d.copyMsg) + '">Copy message for Claude to make it permanent</button>';
      } else {
        actionCell += '<span class="text-xs text-slate-500">—</span>';
      }
    } else {
      actionCell +=
        '<button class="check-btn text-xs font-medium px-3 py-1.5 rounded-md border border-sky-400/40 bg-sky-400/10 text-sky-300 hover:bg-sky-400/20 disabled:opacity-50 disabled:cursor-default transition-colors" data-company="' + escapeHtml(d.company) + '" data-slug="' + slug + '">I applied — check email</button>' +
        '<button class="no-email-btn text-[11px] text-slate-400 hover:text-slate-300 underline underline-offset-2 bg-transparent border-0 p-0 cursor-pointer disabled:opacity-50 disabled:cursor-default" data-company="' + escapeHtml(d.company) + '" data-slug="' + slug + '">Applied — this company doesn\'t send confirmation emails</button>' +
        '<span class="text-xs text-slate-500 max-w-[22ch]" id="btn-status-' + slug + '"></span>';
    }
    actionCell +=
      '<button class="remove-btn text-[11px] text-slate-500 hover:text-red-400 underline underline-offset-2 bg-transparent border-0 p-0 cursor-pointer disabled:opacity-50 disabled:cursor-default" data-company="' + escapeHtml(d.company) + '" data-slug="' + slug + '">Remove — posting closed/withdrawn</button>' +
      '<span class="text-xs text-slate-500 max-w-[22ch]" id="remove-status-' + slug + '"></span>';
    actionCell += '</div>';

    return (
      '<div class="grid grid-cols-[1.5fr_0.8fr_1.05fr_0.9fr_1.05fr] gap-4 p-4 items-start hover:bg-slate-800/50 transition-colors">' +
        '<div>' +
          '<div class="font-display text-base font-medium text-slate-100">' + escapeHtml(d.company) + '</div>' +
          '<div class="text-sm text-slate-400 mt-0.5">' + escapeHtml(d.role) + '</div>' +
          '<div class="text-xs text-slate-500 font-mono mt-1">' + escapeHtml(d.location || "") + '</div>' +
        '</div>' +
        '<div>' +
          '<span class="inline-flex items-center gap-1.5 text-[11px] font-mono uppercase tracking-wide px-2 py-1 rounded border ' + pillClasses + '"><span class="w-1.5 h-1.5 rounded-full bg-current"></span>' + escapeHtml(d.status) + '</span>' +
          (d.date ? '<div class="font-mono text-xs text-slate-500 mt-1.5">' + escapeHtml(d.date) + '</div>' : '') +
        '</div>' +
        '<div class="text-sm text-slate-400">' + escapeHtml(d.evidence || "") + '</div>' +
        '<div class="flex flex-col items-start gap-1.5">' + links + '</div>' +
        actionCell +
      '</div>'
    );
  }

  function renderAll() {
    var interview = DATA.filter(function (r) { return r.status === "interview"; });
    var applied = DATA.filter(function (r) { return r.status === "applied"; });
    var prepared = DATA.filter(function (r) { return r.status !== "applied" && r.status !== "interview"; });

    document.getElementById("stat-interview").textContent = interview.length;
    document.getElementById("stat-applied").textContent = applied.length;
    document.getElementById("stat-prepared").textContent = prepared.length;
    document.getElementById("stat-total").textContent = DATA.length;
    document.getElementById("interview-count").textContent = interview.length + (interview.length === 1 ? " company" : " companies");
    document.getElementById("applied-count").textContent = applied.length + (applied.length === 1 ? " company" : " companies");
    document.getElementById("prepared-count").textContent = prepared.length + (prepared.length === 1 ? " company" : " companies");

    var emptyClasses = "p-10 text-center text-slate-500 text-sm";
    document.getElementById("interview-list").innerHTML =
      interview.length ? interview.map(renderRow).join("") : '<div class="' + emptyClasses + '">No interviews yet.</div>';
    document.getElementById("applied-list").innerHTML =
      applied.length ? applied.map(renderRow).join("") : '<div class="' + emptyClasses + '">Nothing applied yet.</div>';
    document.getElementById("prepared-list").innerHTML =
      prepared.length ? prepared.map(renderRow).join("") : '<div class="' + emptyClasses + '">Nothing queued.</div>';

    document.getElementById("updated-line").textContent =
      DATA.length + " application" + (DATA.length === 1 ? "" : "s") + " tracked.";
  }
  renderAll();

  // --- Gmail check (Google Identity Services, read-only, your own consent) ---
  var GOOGLE_CLIENT_ID = "829569303458-ski7kbln88ca88r13ti5a20irshebcv7.apps.googleusercontent.com";
  var GMAIL_SCOPE = "https://www.googleapis.com/auth/gmail.readonly";
  var tokenClient = null;
  var gmailAccessToken = null;

  function ensureAccessToken(callback) {
    if (gmailAccessToken) {
      callback(gmailAccessToken, null);
      return;
    }
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      callback(null, "not_loaded");
      return;
    }
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: function () {}
      });
    }
    tokenClient.callback = function (resp) {
      if (resp && resp.error) {
        callback(null, resp.error);
      } else if (resp && resp.access_token) {
        gmailAccessToken = resp.access_token;
        callback(gmailAccessToken, null);
      } else {
        callback(null, "no_token");
      }
    };
    tokenClient.requestAccessToken({ prompt: "" });
  }

  function header(headers, name) {
    var f = (headers || []).find(function (x) { return x.name === name; });
    return f ? f.value : "";
  }

  // Per-company verification term: what must actually appear in the email
  // before we trust a "match" (Gmail's search silently broadens to loosely
  // related results when a strict query finds nothing — this is the safety
  // net against that).
  // Single-word, genuinely-present terms only. A multi-word phrase here (or
  // in the search query below) silently fails whenever the real email omits
  // one of the words — e.g. "intact financial" never matches Intact's real
  // confirmation email, which only ever says "Intact", never "Financial
  // Corporation". Verified against real inbox content before narrowing.
  var MATCH_TERMS = {
    "Visier Solutions": "visier",
    "Kinaxis": "kinaxis",
    "Zaber Technologies": "zaber",
    "Rivian and Volkswagen Group Technologies": "rivian",
    "Atlassian": "atlassian",
    "Remarcable": "remarcable",
    "AMD": "amd",
    "Intact Financial Corporation": "intact",
    "Trench Group": "trench",
    "Lyft": "lyft",
    "General Dynamics Mission Systems–Canada": "general dynamics",
    "Later": "later",
    "Amazon": "amazon",
    "SECURE": "secure",
    "Bree": "bree",
    "ARC Resources Ltd.": "arc resources",
    "Loblaw Digital": "loblaw",
    "QuadReal Property Group": "quadreal",
    "Microsoft": "microsoft",
    "A Thinking Ape": "thinking ape",
    // NOTE: same match term as "Visier Solutions" above (both are real Visier
    // postings) -- the check-email button can't reliably tell these two roles
    // apart from a Greenhouse receipt alone. If both get applied to, verify
    // by hand which confirmation belongs to which before trusting the button.
    "Visier Solutions (Test Developer)": "visier",
    "Alexander College": "alexander",
    "AbCellera": "abcellera",
    "BC Hydro": "bc hydro",
    "FortisBC": "fortisbc"
  };

  function findDataEntry(company) {
    for (var i = 0; i < DATA.length; i++) {
      if (DATA[i].company === company) return DATA[i];
    }
    return null;
  }

  async function checkGmailFor(company, slug, statusEl, btn) {
    statusEl.textContent = "Signing in to Google…";
    ensureAccessToken(async function (token, err) {
      if (err || !token) {
        statusEl.textContent =
          err === "not_loaded"
            ? "Google sign-in still loading — try again in a second."
            : "Google sign-in didn't complete. Try again.";
        btn.disabled = false;
        return;
      }
      statusEl.textContent = "Checking your email…";
      try {
        var matchTerm = (MATCH_TERMS[company] || company).toLowerCase();
        // Unquoted, single-word term — a quoted full legal company name
        // (e.g. "Intact Financial Corporation") almost never appears verbatim
        // in a real ATS confirmation email and silently returns zero results.
        var q = matchTerm + ' (application OR applying OR "thank you for" OR received OR interview OR assessment) newer_than:7d -from:me';
        var listResp = await fetch(
          "https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=8&q=" + encodeURIComponent(q),
          { headers: { Authorization: "Bearer " + token } }
        );
        var listJson = await listResp.json();
        if (!listResp.ok) {
          if (listResp.status === 401) {
            gmailAccessToken = null;
            statusEl.textContent = "Session expired — click again to re-sign in.";
          } else {
            statusEl.textContent = "Gmail check failed (" + listResp.status + ").";
          }
          btn.disabled = false;
          return;
        }
        var messages = listJson.messages || [];
        var verified = null;
        for (var i = 0; i < messages.length; i++) {
          var msgResp = await fetch(
            "https://gmail.googleapis.com/gmail/v1/users/me/messages/" + messages[i].id +
              "?format=metadata&metadataHeaders=Subject&metadataHeaders=From",
            { headers: { Authorization: "Bearer " + token } }
          );
          var msgJson = await msgResp.json();
          var headers = (msgJson.payload && msgJson.payload.headers) || [];
          var subject = header(headers, "Subject");
          var from = header(headers, "From");
          var snippet = msgJson.snippet || "";
          var haystack = (subject + " " + from + " " + snippet).toLowerCase();
          if (haystack.indexOf(matchTerm) !== -1) {
            verified = { subject: subject, from: from, threadId: msgJson.threadId || messages[i].id };
            break;
          }
        }

        if (!verified) {
          statusEl.textContent = "No confirmation email found yet for " + company + ".";
          btn.disabled = false;
          return;
        }

        var today = new Date().toISOString().slice(0, 10);
        var emailLink = "https://mail.google.com/mail/u/0/#all/" + verified.threadId;
        var evidenceText = "Confirmed — " + verified.from + ', "' + verified.subject + '"';
        var evidenceMsg =
          "Mark " + company + " as applied. " + evidenceText + " (found " + today + "). Email: " + emailLink;

        // Move the row instantly in the DOM.
        var entry = findDataEntry(company);
        if (entry) {
          entry.status = "applied";
          entry.date = today;
          entry.evidence = evidenceText;
          entry.emailLink = emailLink;
          entry.copyMsg = evidenceMsg; // fallback, cleared below if the save succeeds
          renderAll();
        }

        // Try to persist permanently via the serverless function. If it's
        // not deployed/configured yet, this fails silently and the
        // "copy message" fallback (set above) stays visible instead.
        try {
          var saveResp = await fetch("/api/mark-applied", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ company: company, evidence: evidenceText, date: today, emailLink: emailLink }),
          });
          if (saveResp.ok) {
            if (entry) {
              entry.copyMsg = null;
              renderAll();
            }
          }
        } catch (saveErr) {
          // network/CORS/not-deployed — fallback message already showing
        }
      } catch (e) {
        statusEl.textContent = "Error checking Gmail. Try again.";
        btn.disabled = false;
      }
    });
  }

  async function markAppliedNoEmail(company, slug, statusEl, btn) {
    if (!window.confirm('Mark "' + company + '" as applied? Use this only when you\'ve actually submitted the application and know this company doesn\'t send a confirmation email.')) {
      return;
    }
    btn.disabled = true;
    statusEl.textContent = "Saving…";
    var today = new Date().toISOString().slice(0, 10);
    var evidenceText = "Marked applied manually — this company doesn't send confirmation emails.";

    var entry = findDataEntry(company);
    if (entry) {
      entry.status = "applied";
      entry.date = today;
      entry.evidence = evidenceText;
      entry.copyMsg = "Mark " + company + " as applied. " + evidenceText + " (found " + today + ").";
      renderAll();
    }

    try {
      var resp = await fetch("/api/mark-applied", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ company: company, evidence: evidenceText, date: today }),
      });
      if (resp.ok && entry) {
        entry.copyMsg = null;
        renderAll();
      }
    } catch (saveErr) {
      // network/CORS/not-deployed — fallback "copy message" stays showing
    }
  }

  async function removeJob(company, slug, statusEl, btn) {
    if (!window.confirm('Remove "' + company + '" from the tracker? This can\'t be undone.')) {
      return;
    }
    btn.disabled = true;
    statusEl.textContent = "Removing…";
    try {
      var resp = await fetch("/api/remove-job", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ company: company }),
      });
      if (!resp.ok) {
        var errJson = await resp.json().catch(function () { return {}; });
        statusEl.textContent = "Couldn't remove (" + (errJson.error || resp.status) + ").";
        btn.disabled = false;
        return;
      }
      DATA = DATA.filter(function (r) { return r.company !== company; });
      renderAll();
    } catch (e) {
      statusEl.textContent = "Network error — try again.";
      btn.disabled = false;
    }
  }

  document.addEventListener("click", function (e) {
    var checkBtn = e.target.closest(".check-btn");
    if (checkBtn) {
      checkBtn.disabled = true;
      var company = checkBtn.dataset.company;
      var slug = checkBtn.dataset.slug;
      var statusEl = document.getElementById("btn-status-" + slug);
      checkGmailFor(company, slug, statusEl, checkBtn);
      return;
    }
    var copyBtn = e.target.closest(".copy-msg");
    if (copyBtn) {
      var msg = copyBtn.dataset.msg;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function () {
          copyBtn.textContent = "Copied ✓";
        }).catch(function () {
          copyBtn.textContent = "Copy failed — select manually";
        });
      }
      return;
    }
    var removeBtn = e.target.closest(".remove-btn");
    if (removeBtn) {
      var rCompany = removeBtn.dataset.company;
      var rSlug = removeBtn.dataset.slug;
      var rStatusEl = document.getElementById("remove-status-" + rSlug);
      removeJob(rCompany, rSlug, rStatusEl, removeBtn);
      return;
    }
    var noEmailBtn = e.target.closest(".no-email-btn");
    if (noEmailBtn) {
      var neCompany = noEmailBtn.dataset.company;
      var neSlug = noEmailBtn.dataset.slug;
      var neStatusEl = document.getElementById("btn-status-" + neSlug);
      markAppliedNoEmail(neCompany, neSlug, neStatusEl, noEmailBtn);
    }
  });
</script>
</body>
